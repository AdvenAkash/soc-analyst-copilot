<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOC Analyst Copilot</title>
    <meta name="description" content="AI-powered Security Operations Center dashboard — 4-agent pipeline for SIEM alert triage" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { font-size: 16px; }
      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.16); border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.28); }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.72); }
      }
      @keyframes pulseRing {
        0%   { box-shadow: 0 0 0 0   rgba(0,102,204,0.50); }
        70%  { box-shadow: 0 0 0 8px rgba(0,102,204,0); }
        100% { box-shadow: 0 0 0 0   rgba(0,102,204,0); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
